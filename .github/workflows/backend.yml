name: Backend

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: angles
          POSTGRES_PASSWORD: angles
          POSTGRES_DB: angles_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U angles -d angles_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://angles:angles@127.0.0.1:5432/angles_test
      DATABASE_URL_TEST: postgresql://angles:angles@127.0.0.1:5432/angles_test
      COOK_SIGNING_KEY: ci-only-cook-signing-key-32-characters
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-32-characters
      METERING_HMAC_KEY: ci-only-metering-hmac-key-32-characters
      SUBSCRIPTION_ENFORCEMENT: off
      USAGE_ENFORCEMENT: off

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable package manager
        run: corepack enable && corepack install

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('backend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Test
        run: pnpm test
