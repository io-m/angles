services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: angles
      POSTGRES_PASSWORD: angles
      POSTGRES_DB: angles
    volumes:
      - angles_pg:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U angles -d angles"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  angles_pg:
