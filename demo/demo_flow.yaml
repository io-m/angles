# The recorded take. Starts on Home (warmup.yaml got it there), cooks DEMO_LINE
# for real, walks the four style chips the card has (any four of the six), and holds the
# last one. The edit always cuts four chapters then the outro (see demo/README.md Cut contract).
# Do not tap Post, Save, or jump back to a "best" style.
#
# Env (make_video.sh passes these):
#   DEMO_LINE       the thought to type
#   FOLLOWUP_REPLY  honest answer if Angles asks one follow-up
#   BEST_STYLE      auto | stoic | hopeful | witty | tough | tender | values
appId: app.angles.ios
---
- evalScript: "${output.demo = { marks: [], followups: 0, answers: {}, options: [] }}"
- evalScript: ${output.demo.marks.push(['flow_start', Date.now()])}

# 1. Sparkle opens compose with the keyboard up.
- tapOn: "Inspire me"
- evalScript: ${output.demo.marks.push(['compose_tap', Date.now()])}
- extendedWaitUntil:
    visible:
      id: "compose.input"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- evalScript: ${output.demo.marks.push(['keyboard_up', Date.now()])}

# 2. Type at a natural pace, then send.
- runScript:
    file: flows/split_line.js
    env:
      DEMO_LINE: ${DEMO_LINE}
- evalScript: ${output.demo.marks.push(['type_start', Date.now()])}
- repeat:
    while:
      true: ${output.demo.chunkIndex < output.demo.chunks.length}
    commands:
      - inputText: ${output.demo.chunks[output.demo.chunkIndex]}
      - evalScript: ${output.demo.chunkIndex = output.demo.chunkIndex + 1}
- evalScript: ${output.demo.marks.push(['type_end', Date.now()])}
- runFlow:
    file: flows/hold.yaml
    env:
      HOLD_MS: 600
- evalScript: ${output.demo.marks.push(['send', Date.now()])}
- tapOn:
    id: "compose.send"
    waitToSettleTimeoutMs: 200
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: "compose.cooking"
    timeout: 3000
    optional: true
- evalScript: ${output.demo.marks.push(['cooking', Date.now()])}

# 3 and 4. Let it cook. Answer at most one follow-up; stop on a crisis turn or an error.
- repeat:
    times: 150
    while:
      notVisible:
        id: "compose.card"
    commands:
      - runFlow:
          when:
            visible:
              id: "compose.crisis"
          commands:
            - evalScript: ${output.demo.crisis = true}
            - runScript:
                file: flows/report.js
            - assertTrue:
                condition: ${false}
                label: "Angles answered with a crisis line. That is not a video."
      - runFlow:
          when:
            visible:
              id: "compose.error"
          commands:
            - copyTextFrom:
                id: "compose.error"
            - evalScript: ${output.demo.error = maestro.copiedText}
            - runScript:
                file: flows/report.js
            - assertTrue:
                condition: ${false}
                label: "The cook failed with an error bubble."
      - runFlow:
          when:
            visible:
              id: "compose.followup"
          file: flows/answer_followup.yaml
      - runFlow:
          when:
            true: ${output.demo.followups > 0 && !output.demo.cookingAgain}
            visible:
              id: "compose.cooking"
          commands:
            - evalScript: ${output.demo.cookingAgain = true}
            - evalScript: ${output.demo.marks.push(['cooking_after_followup', Date.now()])}
      - extendedWaitUntil:
          visible:
            id: "compose.card"
          timeout: 1000
          optional: true
- extendedWaitUntil:
    visible:
      id: "compose.card"
    timeout: 1000
- waitForAnimationToEnd:
    timeout: 2000
- evalScript: ${output.demo.marks.push(['card', Date.now()])}

# The cut is exactly four chapters: the four styles this cook wrote, whichever they are.
# The app always gives a card four of the six, so there is nothing to assert here.

# 5. Hold on the first answer.
- runFlow:
    file: flows/hold.yaml
    env:
      HOLD_MS: 700
- copyTextFrom:
    id: "compose.card"
- runScript:
    file: flows/read_answer.js
    env:
      STYLE_KEY: auto

# 6. Tap every other chip on the card, once, in this fixed order (Tough last when the card has
# it). Short holds; the edit trims tighter. firstStyle is the chip the card opened on.
- runFlow:
    when:
      visible:
        id: "chip.stoic"
        childOf:
          id: "compose.card"
      true: ${output.demo.firstStyle !== 'stoic'}
    file: flows/chip.yaml
    env:
      STYLE_KEY: stoic
      STYLE_NAME: Stoic
      HOLD_MS: 550
- runFlow:
    when:
      visible:
        id: "chip.hopeful"
        childOf:
          id: "compose.card"
      true: ${output.demo.firstStyle !== 'hopeful'}
    file: flows/chip.yaml
    env:
      STYLE_KEY: hopeful
      STYLE_NAME: Hopeful
      HOLD_MS: 550
- runFlow:
    when:
      visible:
        id: "chip.witty"
        childOf:
          id: "compose.card"
      true: ${output.demo.firstStyle !== 'witty'}
    file: flows/chip.yaml
    env:
      STYLE_KEY: witty
      STYLE_NAME: Witty
      HOLD_MS: 550
- runFlow:
    when:
      visible:
        id: "chip.tender"
        childOf:
          id: "compose.card"
      true: ${output.demo.firstStyle !== 'tender'}
    file: flows/chip.yaml
    env:
      STYLE_KEY: tender
      STYLE_NAME: Tender
      HOLD_MS: 550
- runFlow:
    when:
      visible:
        id: "chip.values"
        childOf:
          id: "compose.card"
      true: ${output.demo.firstStyle !== 'values'}
    file: flows/chip.yaml
    env:
      STYLE_KEY: values
      STYLE_NAME: Values
      HOLD_MS: 550
- runFlow:
    when:
      visible:
        id: "chip.tough"
        childOf:
          id: "compose.card"
      true: ${output.demo.firstStyle !== 'tough'}
    file: flows/chip.yaml
    env:
      STYLE_KEY: tough
      STYLE_NAME: Tough
      HOLD_MS: 550
- runFlow:
    file: flows/hold.yaml
    env:
      HOLD_MS: 2800

# 7. Score the answers for the report; the edit holds Tough then the outro.
- runScript:
    file: flows/pick_best.js
    env:
      BEST_STYLE: ${BEST_STYLE}
- evalScript: "${output.demo.bestName = ({ stoic: 'Stoic', hopeful: 'Hopeful', witty: 'Witty', tough: 'Tough', tender: 'Tender', values: 'Values' })[output.demo.best]}"
- runScript:
    file: flows/report.js
