# Find the card the private save just opened, heart it, then show Hearts.
appId: app.angles.ios
---
- evalScript: "${output.demo = { marks: [], followups: 0, answers: {}, options: [] }}"
- tapOn: "Stoic"
- runFlow:
    file: flows/hold.yaml
    env:
      HOLD_MS: 800
- takeScreenshot: tab-stoic
- runFlow:
    when:
      notVisible: "Add to Hearts"
    commands:
      - tapOn: "Hopeful"
      - runFlow:
          file: flows/hold.yaml
          env:
            HOLD_MS: 600
      - takeScreenshot: tab-hopeful
- runFlow:
    when:
      notVisible: "Add to Hearts"
    commands:
      - tapOn: "Witty"
      - runFlow:
          file: flows/hold.yaml
          env:
            HOLD_MS: 600
      - takeScreenshot: tab-witty
- runFlow:
    when:
      notVisible: "Add to Hearts"
    commands:
      - tapOn: "Tough"
      - runFlow:
          file: flows/hold.yaml
          env:
            HOLD_MS: 600
      - takeScreenshot: tab-tough
- extendedWaitUntil:
    visible: "Add to Hearts"
    timeout: 8000
- evalScript: ${output.demo.marks.push(['heart_tap', Date.now()])}
- tapOn:
    text: "Add to Hearts"
    index: 0
- extendedWaitUntil:
    visible: "Remove from Hearts"
    timeout: 8000
- evalScript: ${output.demo.marks.push(['heart_shown', Date.now()])}
- runFlow:
    file: flows/hold.yaml
    env:
      HOLD_MS: 1600
- tapOn: "Hearts"
- runFlow:
    file: flows/hold.yaml
    env:
      HOLD_MS: 1400
- takeScreenshot: hearts
- runScript:
    file: flows/report.js
