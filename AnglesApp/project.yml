name: AnglesApp
options:
  bundleIdPrefix: app.angles
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  fileTypes:
    icon:
      file: true
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
packages:
  Lottie:
    url: https://github.com/airbnb/lottie-ios.git
    from: 4.5.0
targets:
  AnglesApp:
    type: application
    platform: iOS
    sources:
      - path: AnglesApp
        excludes:
          - "**/.DS_Store"
          - Info.plist
          - Info-Debug.plist
      - path: Shared
    dependencies:
      - package: Lottie
      - target: AnglesWidgets
        embed: true
    entitlements:
      path: AnglesApp/Angles.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.security.application-groups:
          - group.app.angles.ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.angles.ios
        PRODUCT_NAME: Angles
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "13"
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: AnglesApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: AnglesApp/Angles.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: Angles
        DEVELOPMENT_TEAM: 36U79UTZM9
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        # Devices cannot reach localhost; Debug points at the Mac's LAN IP.
        Debug:
          ANGLES_API_BASE_URL: "http://192.168.0.39:8787"
          ANGLES_PRIVACY_POLICY_URL: "https://useangles.app/privacy"
          ANGLES_TERMS_OF_SERVICE_URL: "https://useangles.app/terms"
          ANGLES_SUPPORT_URL: "https://useangles.app/support"
          ANGLES_SUPPORT_EMAIL: "info@bithavn.app"
          INFOPLIST_FILE: AnglesApp/Info-Debug.plist
        # The Railway production API (`api` service in the `angles` project).
        Release:
          ANGLES_API_BASE_URL: "https://api-production-61c9.up.railway.app"
          ANGLES_PRIVACY_POLICY_URL: "https://useangles.app/privacy"
          ANGLES_TERMS_OF_SERVICE_URL: "https://useangles.app/terms"
          ANGLES_SUPPORT_URL: "https://useangles.app/support"
          ANGLES_SUPPORT_EMAIL: "info@bithavn.app"
    scheme:
      testTargets:
        - AnglesAppTests
  AnglesWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: AnglesWidgets
        excludes:
          - Info.plist
          - AnglesWidgets.entitlements
      - path: Shared
    entitlements:
      path: AnglesWidgets/AnglesWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.angles.ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.angles.ios.widgets
        PRODUCT_NAME: AnglesWidgets
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "13"
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: AnglesWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: AnglesWidgets/AnglesWidgets.entitlements
        DEVELOPMENT_TEAM: 36U79UTZM9
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: true
        APPLICATION_EXTENSION_API_ONLY: true
        TARGETED_DEVICE_FAMILY: "1"
  # Pure gate/session logic only. Runs hosted on Joe's iPhone; StoreKit is never exercised here.
  AnglesAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AnglesAppTests
    dependencies:
      - target: AnglesApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.angles.ios.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Angles.app/Angles"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: true
        DEVELOPMENT_TEAM: 36U79UTZM9
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
