name: AnglesApp
options:
  bundleIdPrefix: app.angles
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  fileTypes:
    icon:
      file: true
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
packages:
  Lottie:
    url: https://github.com/airbnb/lottie-ios.git
    from: 4.5.0
targets:
  AnglesApp:
    type: application
    platform: iOS
    sources:
      - path: AnglesApp
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: Lottie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.angles.ios
        PRODUCT_NAME: Angles
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "7"
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: AnglesApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: Angles
        DEVELOPMENT_TEAM: 36U79UTZM9
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        # Devices cannot reach localhost; Debug points at the Mac's LAN IP.
        Debug:
          ANGLES_API_BASE_URL: "http://192.168.0.39:8787"
        # Empty until the production host exists; requests fail locally rather than guess a host.
        Release:
          ANGLES_API_BASE_URL: ""
    info:
      path: AnglesApp/Info.plist
      properties:
        CFBundleDisplayName: Angles
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        AnglesAPIBaseURL: "$(ANGLES_API_BASE_URL)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Angles talks to the API on your Mac while developing.
    scheme: {}
